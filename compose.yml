services:
  monitor:
    build:
      context: .
    environment:
      NODE_ENV: production
      PORT: 3200
      MONITOR_PUBLIC_URL: ${MONITOR_PUBLIC_URL:-https://monitor.oncoorch.com}
      MONITOR_SESSION_SECRET: ${MONITOR_SESSION_SECRET:-change_me_session_secret}
      MONITOR_USERS_B64: ${MONITOR_USERS_B64:-change_me_users_b64}
      MONITOR_RESOURCES_B64: ${MONITOR_RESOURCES_B64:-change_me_resources_b64}
      MONITOR_DATABASE_URL: postgres://monitor:${MONITOR_POSTGRES_PASSWORD:-change_me}@monitor_postgres:5432/monitor
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      ALERT_WHATSAPP_INSTANCE: ${ALERT_WHATSAPP_INSTANCE:-NICOP USA}
      ALERT_WHATSAPP_NUMBER: ${ALERT_WHATSAPP_NUMBER:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    depends_on:
      monitor_postgres:
        condition: service_healthy
    ports:
      - "3200:3200"
    labels:
      - traefik.enable=true
      - traefik.http.routers.lagarto-monitor-web.rule=Host(`monitor.oncoorch.com`)
      - traefik.http.routers.lagarto-monitor-web.entrypoints=web
      - traefik.http.routers.lagarto-monitor-web.middlewares=lagarto-monitor-https
      - traefik.http.middlewares.lagarto-monitor-https.redirectscheme.scheme=https
      - traefik.http.routers.lagarto-monitor-websecure.rule=Host(`monitor.oncoorch.com`)
      - traefik.http.routers.lagarto-monitor-websecure.entrypoints=websecure
      - traefik.http.routers.lagarto-monitor-websecure.tls=true
      - traefik.http.routers.lagarto-monitor-websecure.tls.certresolver=letsencrypt
      - traefik.http.routers.lagarto-monitor-websecure.service=lagarto-monitor
      - traefik.http.services.lagarto-monitor.loadbalancer.server.port=3200

  monitor_postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: ${MONITOR_POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: monitor
    volumes:
      - monitor_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor -d monitor"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  monitor_postgres_data:
